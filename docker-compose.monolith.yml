name: clinic-monolith

services:
  mono-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clinic_mono_sql_server
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw}
      - MSSQL_PID=Express
    ports:
      - "1434:1433"
    volumes:
      - mssql_mono_data:/var/opt/mssql
    networks:
      mono-network:
        aliases:
          - db
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M
        reservations:
          cpus: '2.0'
          memory: 1024M
    restart: always

  mono-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clinic-monolith-backend:latest
    container_name: clinic_mono_backend
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Server=db,1433;Database=ClinicDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;}
      - Jwt__Key=${JWT_KEY:-SuperR4nd0mK3yForJWTTokenGenerat!onUsedForDevelopmentPurposesOnly}
      - Email__Username=${SMTP_USERNAME:-mock-notifications@clinic.local}
      - Email__Password=${SMTP_PASSWORD:-mock-dev-password}
      - Email__Host=${SMTP_HOST:-mock}
      - Email__UseMock=true
    depends_on:
      mono-db:
        condition: service_healthy
    networks:
      mono-network:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 1536M
        reservations:
          cpus: '2.0'
          memory: 512M
    restart: always

  mono-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clinic-monolith-frontend:latest
    container_name: clinic_mono_frontend
    ports:
      - "3100:80"
    depends_on:
      mono-backend:
        condition: service_healthy
    networks:
      - mono-network
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    restart: always

volumes:
  mssql_mono_data:

networks:
  mono-network:
    name: clinic_monolith_network
