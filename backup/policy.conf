# Backup policy (docs/BACKUP_RECOVERY.md). One line per database; intervals in minutes.
#
#   full_min  interval between full backups (base of every restore chain)
#   diff_min  interval between differential backups (changes since the last full; 0 = none)
#   log_min   interval between transaction-log backups (0 = none; requires RECOVERY FULL)
#   rpo_min   recovery point objective: max acceptable data loss (status/drill gate)
#   rto_min   recovery time objective: max acceptable restore time (drill gate)
#
# Worst-case data loss is log_min (+1 min scheduler tick) for FULL-model databases and diff_min for
# SIMPLE-model ones, so each interval is set well inside its RPO.
#
# database                full_min  diff_min  log_min  rpo_min  rto_min  tier
ClinicMedicalRecordsDB    10080     240       5        15       60       critical
ClinicAppointmentDB       10080     360       15       60       60       core
ClinicSchedulingDB        10080     360       15       60       60       core
ClinicQueueDB             10080     360       15       60       60       core
ClinicIdentityDB          10080     360       0        1440     60       supporting
ClinicNotificationDB      10080     720       0        1440     240      supporting
