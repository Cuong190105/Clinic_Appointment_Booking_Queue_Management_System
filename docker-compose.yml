services:
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: clinic_sql_server
        environment:
            - ACCEPT_EULA=Y
            - SA_PASSWORD=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw}
            - MSSQL_PID=Express
        ports:
            - "1433:1433"
        volumes:
            - mssql_data:/var/opt/mssql
        healthcheck:
            test:
                - CMD-SHELL
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: always

    rabbitmq:
        image: rabbitmq:3.13-management
        hostname: clinic-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: clinic
            RABBITMQ_DEFAULT_PASS: clinic-dev-password
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: always

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile # Đường dẫn tới Dockerfile của Backend
        container_name: clinic_backend
        ports:
            - "5000:8080"
        environment:
            - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
            - Identity__Authority=http://identity-service:8080
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Scheduling__Authority=http://scheduling-service:8080
            - Services__Scheduling__BaseUrl=http://scheduling-service:8080
            - Appointment__Authority=http://appointment-service:8080
            - Identity__RequireHttpsMetadata=false
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__PublicBaseUrl=${IDENTITY_PUBLIC_BASE_URL:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - Jwt__Key=${JWT_KEY}
            - Jwt__RefreshTokenDays=${IDENTITY_REFRESH_TOKEN_DAYS:-7}
            - Email__Username=${SMTP_USERNAME}
            - Email__Password=${SMTP_PASSWORD}
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=clinic-dev-password
            - RabbitMq__VirtualHost=/
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
        depends_on:
            identity-service:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            db:
                condition: service_healthy
            jaeger:
                condition: service_started
        healthcheck:
            test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    identity-service:
        build:
            context: ./backend
            dockerfile: Clinic.Identity.Service/Dockerfile
        ports:
            - "5001:8080"
        environment:
            - ConnectionStrings__IdentityConnection=Server=db,1433;Database=ClinicIdentityDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - Jwt__RefreshTokenDays=${IDENTITY_REFRESH_TOKEN_DAYS:-7}
            - Jwt__AccessTokenMinutes=${IDENTITY_ACCESS_TOKEN_MINUTES:-15}
            - Jwt__SigningKeyDirectory=/var/lib/clinic/identity-keys
            - Jwt__PublicBaseUrl=http://identity-service:8080
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - ASPNETCORE_HTTP_PORTS=8080
        volumes:
            - identity_signing_keys:/var/lib/clinic/identity-keys
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    scheduling-service:
        build:
            context: ./backend
            dockerfile: Clinic.Scheduling.Service/Dockerfile
        container_name: clinic_scheduling_service
        ports:
            - "5002:8080"
        environment:
            - ConnectionStrings__SchedulingConnection=Server=db,1433;Database=ClinicSchedulingDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=clinic-dev-password
            - RabbitMq__VirtualHost=/
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    identity-data-importer:
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
              until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
              /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:-ClinicDev!2026StrongPw}
        volumes:
            - ./backend/Clinic.Identity.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        restart: "no"

    scheduling-data-importer:
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
              until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
              /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:-ClinicDev!2026StrongPw}
        volumes:
            - ./backend/Clinic.Scheduling.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
        restart: "no"

    appointment-service:
        build:
            context: ./backend
            dockerfile: Clinic.Appointment.Service/Dockerfile
        container_name: clinic_appointment_service
        ports:
            - "5003:8080"
        environment:
            - ConnectionStrings__AppointmentConnection=Server=db,1433;Database=ClinicAppointmentDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Scheduling__Authority=http://scheduling-service:8080
            - Services__Scheduling__BaseUrl=http://scheduling-service:8080
            - Appointment__Authority=http://appointment-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=clinic-dev-password
            - RabbitMq__VirtualHost=/
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    appointment-data-importer:
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
              until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
              /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:-ClinicDev!2026StrongPw}
        volumes:
            - ./backend/Clinic.Appointment.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            appointment-service:
                condition: service_healthy
        restart: "no"

    frontend:
        build:
            context: ./frontend # Thay bằng đường dẫn tới thư mục Vue.js của bạn
            dockerfile: Dockerfile
        container_name: clinic_frontend
        ports:
            - "3000:80" # Truy cập Frontend ở giao diện máy thật qua port 3000
        depends_on:
            backend:
                condition: service_healthy
            identity-data-importer:
                condition: service_completed_successfully
            scheduling-data-importer:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: always

    prometheus:
        image: prom/prometheus:v2.55.1
        container_name: clinic_prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "--spider",
                    "http://127.0.0.1:9090/-/healthy",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always

    jaeger:
        image: jaegertracing/all-in-one:1.62.0
        container_name: clinic_jaeger
        environment:
            COLLECTOR_OTLP_ENABLED: "true"
        ports:
            - "16686:16686"
            - "4317:4317"
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:14269/"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always

volumes:
    mssql_data:
    rabbitmq_data:
    prometheus_data:
    identity_signing_keys:
