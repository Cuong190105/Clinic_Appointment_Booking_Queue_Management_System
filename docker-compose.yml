services:
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: clinic_sql_server
        environment:
            - ACCEPT_EULA=Y
            - SA_PASSWORD=ClinicDev!2026StrongPw
            - MSSQL_PID=Express
        ports:
            - "1433:1433"
        volumes:
            - mssql_data:/var/opt/mssql
        healthcheck:
            test:
                - CMD-SHELL
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: always

    rabbitmq:
        image: rabbitmq:3.13-management
        hostname: clinic-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: clinic
            RABBITMQ_DEFAULT_PASS: clinic-dev-password
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: always

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile # Đường dẫn tới Dockerfile của Backend
        container_name: clinic_backend
        ports:
            - "5000:8080"
        environment:
            - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
            - Jwt__Key=${JWT_KEY}
            - Email__Username=${SMTP_USERNAME}
            - Email__Password=${SMTP_PASSWORD}
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=clinic-dev-password
            - RabbitMq__VirtualHost=/
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
        depends_on:
            rabbitmq:
                condition: service_healthy
            db:
                condition: service_healthy
            jaeger:
                condition: service_started
        healthcheck:
            test: ["CMD", "/usr/bin/bash", "-c", "</dev/tcp/127.0.0.1/8080"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    frontend:
        build:
            context: ./frontend # Thay bằng đường dẫn tới thư mục Vue.js của bạn
            dockerfile: Dockerfile
        container_name: clinic_frontend
        ports:
            - "3000:80" # Truy cập Frontend ở giao diện máy thật qua port 3000
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: always

    prometheus:
        image: prom/prometheus:v2.55.1
        container_name: clinic_prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "--spider",
                    "http://127.0.0.1:9090/-/healthy",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always

    jaeger:
        image: jaegertracing/all-in-one:1.62.0
        container_name: clinic_jaeger
        environment:
            COLLECTOR_OTLP_ENABLED: "true"
        ports:
            - "16686:16686"
            - "4317:4317"
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:14269/"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always

volumes:
    mssql_data:
    rabbitmq_data:
    prometheus_data:
