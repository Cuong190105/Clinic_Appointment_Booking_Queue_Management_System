services:
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: clinic_sql_server
        environment:
            - ACCEPT_EULA=Y
            - SA_PASSWORD=${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
            - MSSQL_PID=Express
        ports:
            - "1433:1433"
        volumes:
            - mssql_data:/var/opt/mssql
            # Backup files are written by SQL Server here and managed by db-backup (same path in both).
            - mssql_backups:/var/opt/mssql/backup
        networks:
            default:
                aliases:
                    - identity-db
                    - scheduling-db
                    - appointment-db
                    - queue-db
                    - medical-records-db
                    - notification-db
        healthcheck:
            test:
                - CMD-SHELL
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: '4.0'
                    memory: 2048M
                reservations:
                    cpus: '2.0'
                    memory: 1024M
        restart: always

    db-init:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: clinic_db_init
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 2; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b
                -v IdentityPassword="$$DB_IDENTITY_PASSWORD"
                -v SchedulingPassword="$$DB_SCHEDULING_PASSWORD"
                -v AppointmentPassword="$$DB_APPOINTMENT_PASSWORD"
                -v QueuePassword="$$DB_QUEUE_PASSWORD"
                -v MedicalRecordsPassword="$$DB_MEDICAL_RECORDS_PASSWORD"
                -v NotificationPassword="$$DB_NOTIFICATION_PASSWORD"
                -v BackupPassword="$$DB_BACKUP_PASSWORD"
                -i /init-service-logins.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
            DB_IDENTITY_PASSWORD: ${DB_IDENTITY_PASSWORD:?Set DB_IDENTITY_PASSWORD in .env}
            DB_SCHEDULING_PASSWORD: ${DB_SCHEDULING_PASSWORD:?Set DB_SCHEDULING_PASSWORD in .env}
            DB_APPOINTMENT_PASSWORD: ${DB_APPOINTMENT_PASSWORD:?Set DB_APPOINTMENT_PASSWORD in .env}
            DB_QUEUE_PASSWORD: ${DB_QUEUE_PASSWORD:?Set DB_QUEUE_PASSWORD in .env}
            DB_MEDICAL_RECORDS_PASSWORD: ${DB_MEDICAL_RECORDS_PASSWORD:?Set DB_MEDICAL_RECORDS_PASSWORD in .env}
            DB_NOTIFICATION_PASSWORD: ${DB_NOTIFICATION_PASSWORD:?Set DB_NOTIFICATION_PASSWORD in .env}
            DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?Set DB_BACKUP_PASSWORD in .env}
        volumes:
            - ./backend/sql/init-service-logins.sql:/init-service-logins.sql:ro
        depends_on:
            db:
                condition: service_healthy
        restart: "no"

    # Backup scheduler, verifier and restore tooling (docs/BACKUP_RECOVERY.md). Express edition has no
    # SQL Agent, so this sidecar schedules FULL/DIFF/LOG backups per backup/policy.conf, keeps an
    # off-site gzip copy, archives the key volumes, prunes by chain and runs periodic restore drills.
    # It connects as svc_backup (dbcreator + db_backupoperator, no data access), not as sa.
    db-backup:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: clinic_db_backup
        user: "0:0"   # reads the key volumes and hands backup directories to the mssql user (uid 10001)
        entrypoint: ["/bin/bash", "-c"]
        # Scripts are copied with CR stripped so a Windows (CRLF) checkout cannot break them.
        command:
            - >-
                mkdir -p /opt/clinic-backup-run &&
                for f in /opt/clinic-backup/*; do tr -d '\r' < "$$f" > "/opt/clinic-backup-run/$${f##*/}"; done &&
                exec bash /opt/clinic-backup-run/scheduler.sh
        environment:
            BACKUP_SQL_SERVER: db,1433
            BACKUP_SQL_USER: svc_backup
            SQLCMDPASSWORD: ${DB_BACKUP_PASSWORD:?Set DB_BACKUP_PASSWORD in .env}
            BACKUP_POLICY: ${BACKUP_POLICY:-policy}
            BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-8}
            BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-35}
            BACKUP_DRILL_INTERVAL_MIN: ${BACKUP_DRILL_INTERVAL_MIN:-10080}
            BACKUP_KEYS_INTERVAL_MIN: ${BACKUP_KEYS_INTERVAL_MIN:-1440}
            BACKUP_TICK_SECONDS: ${BACKUP_TICK_SECONDS:-60}
        volumes:
            - ./backup:/opt/clinic-backup:ro
            - mssql_backups:/var/opt/mssql/backup
            # Second copy on different storage: point BACKUP_OFFSITE_DIR at another disk or a synced folder.
            - ${BACKUP_OFFSITE_DIR:-./backups/offsite}:/offsite
            - identity_signing_keys:/sources/identity-signing-keys:ro
            - notification_protection_keys:/sources/notification-protection-keys:ro
        depends_on:
            db:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "bash", "/opt/clinic-backup-run/status.sh", "--quiet"]
            interval: 60s
            timeout: 30s
            retries: 3
            start_period: 10m
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    cpus: '0.05'
                    memory: 64M
        restart: always

    rabbitmq:
        image: rabbitmq:3.13-management
        hostname: clinic-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
        environment:
            RABBITMQ_DEFAULT_USER: clinic
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
        command:
            - /bin/bash
            - -c
            - rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    cpus: '0.25'
                    memory: 128M
        restart: always

    mssql-exporter:
        image: awaragi/prometheus-mssql-exporter:latest
        environment:
            SERVER: db
            PORT: 1433
            USERNAME: sa
            PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
            ENCRYPT: "false"
            TRUST_SERVER_CERTIFICATE: "true"
        depends_on:
            db:
                condition: service_healthy
        expose:
            - "4000"
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 128M
        restart: always

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile # ÄÆ°á»ng dáº«n tá»›i Dockerfile cá»§a Backend
        container_name: clinic_backend
        ports:
            - "5000:8080"
        environment:
            - CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Ho_Chi_Minh}
            - Identity__Authority=http://identity-service:8080
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Scheduling__Authority=http://scheduling-service:8080
            - Services__Scheduling__BaseUrl=http://scheduling-service:8080
            - Appointment__Authority=http://appointment-service:8080
            - Queue__Authority=http://queue-service:8080
            - Services__Queue__BaseUrl=http://queue-service:8080
            - MedicalRecords__Authority=http://medical-records-service:8080
            - Services__MedicalRecords__BaseUrl=http://medical-records-service:8080
            - Notification__Authority=http://notification-service:8080
            - Services__Notification__BaseUrl=http://notification-service:8080
            - Identity__RequireHttpsMetadata=false
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__PublicBaseUrl=${IDENTITY_PUBLIC_BASE_URL:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - Jwt__RefreshTokenDays=${IDENTITY_REFRESH_TOKEN_DAYS:-7}
            - QoS__RateLimitPermitLimit=${RATE_LIMIT_PERMIT_LIMIT:-100}
            - QoS__StaffRateLimitPermitLimit=${STAFF_RATE_LIMIT_PERMIT_LIMIT:-600}
            - QoS__AnonymousRateLimitPermitLimit=${ANONYMOUS_RATE_LIMIT_PERMIT_LIMIT:-100}
            - QoS__AuthRateLimitPermitLimit=${AUTH_RATE_LIMIT_PERMIT_LIMIT:-10}
            - QoS__BookingRateLimitPermitLimit=${BOOKING_RATE_LIMIT_PERMIT_LIMIT:-10}
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
        depends_on:
            identity-service:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
            appointment-service:
                condition: service_healthy
            queue-service:
                condition: service_healthy
            medical-records-service:
                condition: service_healthy
            notification-service:
                condition: service_healthy
            jaeger:
                condition: service_started
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 384M
                reservations:
                    cpus: '0.5'
                    memory: 128M
        restart: always

    identity-service:
        build:
            context: ./backend
            dockerfile: Clinic.Identity.Service/Dockerfile
        expose:
            - "8080"
        environment:
            - ConnectionStrings__IdentityConnection=Server=identity-db,1433;Database=ClinicIdentityDB;User Id=svc_identity;Password=${DB_IDENTITY_PASSWORD:?Set DB_IDENTITY_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;Min Pool Size=5;Max Pool Size=20;Connect Timeout=10;Application Name=clinic-identity-service;
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - Jwt__RefreshTokenDays=${IDENTITY_REFRESH_TOKEN_DAYS:-7}
            - Jwt__AccessTokenMinutes=${IDENTITY_ACCESS_TOKEN_MINUTES:-15}
            - Jwt__SigningKeyDirectory=/var/lib/clinic/identity-keys
            - QoS__AuthPermitLimit=${IDENTITY_AUTH_RATE_LIMIT_PERMIT_LIMIT:-20}
            # Password-hashing capacity (SLI_SLO_MATRIX §2.3): BCrypt cost 10 (OWASP minimum; older cost-11
            # hashes are re-hashed on login), 1 hash at a time (bulkhead: leaves CPU headroom) and a queue of
            # 4 (~0.4 s wait at capacity, keeps accepted logins within the 1 s SLO), then 503 + Retry-After.
            - Security__BcryptWorkFactor=${IDENTITY_BCRYPT_WORK_FACTOR:-10}
            - QoS__PasswordHashConcurrency=${IDENTITY_PASSWORD_HASH_CONCURRENCY:-1}
            - QoS__PasswordHashQueueLimit=${IDENTITY_PASSWORD_HASH_QUEUE_LIMIT:-4}
            - Jwt__PublicBaseUrl=http://identity-service:8080
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - ASPNETCORE_HTTP_PORTS=8080
        volumes:
            - identity_signing_keys:/var/lib/clinic/identity-keys
        depends_on:
            db:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    # Login throughput is CPU-bound (BCrypt): 1 core for hashing (PasswordHashConcurrency=1) plus
                    # 0.5 headroom so refresh/JWKS and fast load-shed responses are not starved.
                    # Budget taken from frontend (1.0 -> 0.25) and scheduling-service (1.5 -> 1.0).
                    cpus: '1.5'
                    memory: 256M
                reservations:
                    cpus: '0.25'
                    memory: 128M
        restart: always

    scheduling-service:
        build:
            context: ./backend
            dockerfile: Clinic.StaffScheduling.Service/Dockerfile
        container_name: clinic_scheduling_service
        expose:
            - "8080"
        environment:
            - ConnectionStrings__SchedulingConnection=Server=scheduling-db,1433;Database=ClinicSchedulingDB;User Id=svc_scheduling;Password=${DB_SCHEDULING_PASSWORD:?Set DB_SCHEDULING_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;Min Pool Size=10;Max Pool Size=40;Connect Timeout=10;Application Name=clinic-scheduling-service;
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Services__InternalToken=${IDENTITY_SERVICE_TOKEN}
            - MedicalRecords__Authority=http://medical-records-service:8080
            - Services__MedicalRecords__BaseUrl=http://medical-records-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
            medical-records-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    # 0.5 CPU moved to identity-service (password-hashing headroom); Scheduling is I/O-bound
                    # (measured low CPU in every load profile).
                    cpus: '1.0'
                    memory: 384M
                reservations:
                    cpus: '0.5'
                    memory: 192M
        restart: always

    identity-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql &&
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /verify.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
        volumes:
            - ./backend/Clinic.Identity.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            queue-service:
                condition: service_healthy
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            mssql-exporter:
                condition: service_started
            notification-service:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        restart: "no"

    scheduling-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
        volumes:
            - ./backend/Clinic.StaffScheduling.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
            - ./backend/Clinic.StaffScheduling.Service/Persistence/verify-scheduling-import.sql:/verify.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
        restart: "no"

    appointment-service:
        build:
            context: ./backend
            dockerfile: Clinic.Appointment.Service/Dockerfile
        container_name: clinic_appointment_service
        expose:
            - "8080"
        environment:
            - ConnectionStrings__AppointmentConnection=Server=appointment-db,1433;Database=ClinicAppointmentDB;User Id=svc_appointment;Password=${DB_APPOINTMENT_PASSWORD:?Set DB_APPOINTMENT_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;Min Pool Size=10;Max Pool Size=40;Connect Timeout=10;Application Name=clinic-appointment-service;
            - CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Ho_Chi_Minh}
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Scheduling__Authority=http://scheduling-service:8080
            - Services__Scheduling__BaseUrl=http://scheduling-service:8080
            - Appointment__Authority=http://appointment-service:8080
            - Queue__Authority=http://queue-service:8080
            - Services__Queue__BaseUrl=http://queue-service:8080
            - MedicalRecords__Authority=http://medical-records-service:8080
            - Services__MedicalRecords__BaseUrl=http://medical-records-service:8080
            - Notification__Authority=http://notification-service:8080
            - Services__Notification__BaseUrl=http://notification-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: '1.5'
                    memory: 384M
                reservations:
                    cpus: '0.5'
                    memory: 192M
        restart: always

    appointment-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
        volumes:
            - ./backend/Clinic.Appointment.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            appointment-service:
                condition: service_healthy
        restart: "no"

    queue-service:
        build:
            context: ./backend
            dockerfile: Clinic.Queue.Service/Dockerfile
        container_name: clinic_queue_service
        expose:
            - "8080"
        environment:
            - ConnectionStrings__QueueConnection=Server=queue-db,1433;Database=ClinicQueueDB;User Id=svc_queue;Password=${DB_QUEUE_PASSWORD:?Set DB_QUEUE_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;Min Pool Size=5;Max Pool Size=25;Connect Timeout=10;Application Name=clinic-queue-service;
            - CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Ho_Chi_Minh}
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Appointment__Authority=http://appointment-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 256M
                reservations:
                    cpus: '0.5'
                    memory: 128M
        restart: always

    queue-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -v ClinicWindowsTimeZone="$$CLINIC_SQL_TIME_ZONE" -i /migration.sql &&
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /verify.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
            CLINIC_SQL_TIME_ZONE: ${CLINIC_SQL_TIME_ZONE:-SE Asia Standard Time}
        volumes:
            - ./backend/Clinic.Queue.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
            - ./backend/Clinic.Queue.Service/Persistence/verify-queue-import.sql:/verify.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            queue-service:
                condition: service_healthy
        restart: "no"

    medical-records-service:
        build:
            context: ./backend
            dockerfile: Clinic.MedicalRecords.Service/Dockerfile
        container_name: clinic_medical_records_service
        expose:
            - "8080"
        environment:
            - ConnectionStrings__MedicalRecordsConnection=Server=medical-records-db,1433;Database=ClinicMedicalRecordsDB;User Id=svc_medical_records;Password=${DB_MEDICAL_RECORDS_PASSWORD:?Set DB_MEDICAL_RECORDS_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;Min Pool Size=2;Max Pool Size=15;Connect Timeout=10;Application Name=clinic-medical-records-service;
            - CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Ho_Chi_Minh}
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Appointment__Authority=http://appointment-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 192M
                reservations:
                    cpus: '0.1'
                    memory: 64M
        restart: always

    medical-records-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql &&
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /verify.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
        volumes:
            - ./backend/Clinic.MedicalRecords.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
            - ./backend/Clinic.MedicalRecords.Service/Persistence/verify-medical-records-import.sql:/verify.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            medical-records-service:
                condition: service_healthy
        restart: "no"

    notification-service:
        build:
            context: ./backend
            dockerfile: Clinic.Notification.Service/Dockerfile
        container_name: clinic_notification_service
        expose:
            - "8080"
        environment:
            - ConnectionStrings__NotificationConnection=Server=notification-db,1433;Database=ClinicNotificationDB;User Id=svc_notification;Password=${DB_NOTIFICATION_PASSWORD:?Set DB_NOTIFICATION_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False;Min Pool Size=2;Max Pool Size=15;Connect Timeout=10;Application Name=clinic-notification-service;
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Email__Host=${SMTP_HOST:-smtp.gmail.com}
            - Email__Port=${SMTP_PORT:-587}
            - Email__Username=${SMTP_USERNAME}
            - Email__Password=${SMTP_PASSWORD}
            - Email__FromAddress=${SMTP_FROM_ADDRESS:-}
            - Email__FromName=${SMTP_FROM_NAME:-Clinic Notification}
            - DataProtection__KeyDirectory=/var/lib/clinic/notification-protection-keys
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
            - ASPNETCORE_HTTP_PORTS=8080
        volumes:
            - notification_protection_keys:/var/lib/clinic/notification-protection-keys
        depends_on:
            db:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    cpus: '0.2'
                    memory: 128M
        restart: always

    frontend:
        build:
            context: ./frontend # Thay báº±ng Ä‘Æ°á»ng dáº«n tá»›i thÆ° má»¥c Vue.js cá»§a báº¡n
            dockerfile: Dockerfile
        container_name: clinic_frontend
        ports:
            - "3000:80" # Truy cáº­p Frontend á»Ÿ giao diá»‡n mÃ¡y tháº­t qua port 3000
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        deploy:
            resources:
                limits:
                    # nginx serving static files; measured ~0% CPU. CPU budget moved to identity-service.
                    cpus: '0.25'
                    memory: 256M
                reservations:
                    cpus: '0.05'
                    memory: 64M
        restart: always

    prometheus:
        image: prom/prometheus:v2.55.1
        container_name: clinic_prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
            - prometheus_data:/prometheus
        depends_on:
            backend:
                condition: service_healthy
            queue-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "--spider",
                    "http://127.0.0.1:9090/-/healthy",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 192M
                reservations:
                    cpus: '0.05'
                    memory: 64M
        restart: always

    jaeger:
        image: jaegertracing/all-in-one:1.62.0
        container_name: clinic_jaeger
        environment:
            COLLECTOR_OTLP_ENABLED: "true"
        ports:
            - "16686:16686"
            - "4317:4317"
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:14269/"]
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 192M
                reservations:
                    cpus: '0.05'
                    memory: 64M
        restart: always

volumes:
    mssql_data:
    mssql_backups:
    rabbitmq_data:
    prometheus_data:
    identity_signing_keys:
    notification_protection_keys:
