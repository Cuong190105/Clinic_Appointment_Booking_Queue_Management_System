global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "clinic-gateway-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]

  - job_name: "clinic-identity-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-service:8080"]

  - job_name: "clinic-scheduling-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduling-service:8080"]

  - job_name: "clinic-appointment-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["appointment-service:8080"]

  - job_name: "clinic-queue-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["queue-service:8080"]

  - job_name: "clinic-medical-records-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["medical-records-service:8080"]

  - job_name: "clinic-notification-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8080"]
