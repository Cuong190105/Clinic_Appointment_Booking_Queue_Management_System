groups:
  - name: clinic_slo_alerts
    rules:
      - alert: MicroserviceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Microservice {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 30 seconds."

      - alert: LowApiAvailability
        expr: (sum(rate(http_server_request_duration_seconds_count{job="clinic-api",http_response_status_code!~"400|401|403|404|409|422|429|5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{job="clinic-api",http_response_status_code!~"400|401|403|404|409|422|429"}[5m]))) * 100 < 99
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API availability fell below 99% SLO"
          description: "Current Gateway API availability is {{ $value }}%, violating the Phase 8 SLO target of 99%."

      - alert: HighApiLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{job="clinic-api"}[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 API latency exceeds 500ms SLO"
          description: "Gateway p95 response time is {{ $value }}s (SLO <= 0.5s)."

      - alert: HighApiLatencyP99
        expr: histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket{job="clinic-api"}[5m])) by (le)) > 1.5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "p99 API latency exceeds 1.5s SLO"
          description: "Gateway p99 response time is {{ $value }}s (SLO <= 1.5s)."

      - alert: HighErrorRate5xx
        expr: (sum(rate(http_server_request_duration_seconds_count{job="clinic-api",http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{job="clinic-api",http_response_status_code!~"400|401|403|404|409|422|429"}[5m]))) * 100 > 1.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx server error rate exceeds 1% SLO"
          description: "Gateway HTTP 5xx rate is {{ $value }}%, exceeding the 1% maximum error budget."

      - alert: QueueConsumerLagHigh
        expr: histogram_quantile(0.95, sum(rate(clinic_queue_consumer_lag_seconds_bucket[5m])) by (le)) > 5.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Queue consumer event lag exceeds 5.0s SLO"
          description: "p95 event lag is {{ $value }}s in queue consumer."

      - alert: QueueBacklogExcessive
        expr: clinic_queue_length > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queue ticket backlog is excessively high"
          description: "More than 50 waiting tickets pending in clinic queue."

      - alert: DeadLetterQueueNonEmpty
        expr: sum by (queue) (rabbitmq_queue_messages{queue=~".*([.-]dlq|\\.dead)$"}) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ dead-letter queue {{ $labels.queue }} is non-empty"
          description: "{{ $labels.queue }} holds {{ $value }} dead-lettered message(s), violating the 0 DLQ SLO."

      - alert: QueueConsumerDeadLettered
        expr: increase(clinic_queue_consumer_dead_lettered_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Queue consumer dead-lettered messages in the last 5m"
          description: "{{ $value }} message(s) were dead-lettered by Queue consumer."
