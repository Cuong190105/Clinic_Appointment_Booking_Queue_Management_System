groups:
  - name: clinic_slo_alerts
    rules:
      - alert: MicroserviceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Microservice {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 30 seconds."

      - alert: LowApiAvailability
        expr: (sum(rate(http_server_request_duration_seconds_count{http_response_status_code!~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))) * 100 < 99
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API availability fell below 99% SLO"
          description: "Current API availability is {{ $value }}%, violating the Phase 8 SLO target of 99%."

      - alert: HighApiLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 API latency exceeds 500ms SLO"
          description: "p95 response time is {{ $value }}s on job {{ $labels.job }}."

      - alert: HighApiLatencyP99
        expr: histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)) > 1.5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "p99 API latency exceeds 1.5s SLO"
          description: "p99 response time is {{ $value }}s on job {{ $labels.job }}."

      - alert: HighErrorRate5xx
        expr: (sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count[5m]))) * 100 > 1.0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx server error rate exceeds 1% SLO"
          description: "HTTP 5xx rate is {{ $value }}%, exceeding the 1% maximum error budget."

      - alert: QueueConsumerLagHigh
        expr: histogram_quantile(0.95, sum(rate(clinic_queue_consumer_lag_seconds_bucket[5m])) by (le)) > 5.0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Queue consumer event lag exceeds 5.0s SLO"
          description: "p95 event lag is {{ $value }}s in queue consumer."

      - alert: QueueBacklogExcessive
        expr: clinic_queue_length > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queue ticket backlog is excessively high"
          description: "More than 50 waiting tickets pending in clinic queue."
