# ==============================================================================
# Microservices System Compose Configuration
# Benchmark Baseline Commit: 7f556ba (branch main)
# Source worktree: ../microservices (git worktree add ../microservices main)
# Pre-built Image Tags:
#   - clinic_appointment_booking_queue_management_system-backend:latest (6cf21bb9cba8)
#   - clinic_appointment_booking_queue_management_system-identity-service:latest (e7bbf7cc679e)
#   - clinic_appointment_booking_queue_management_system-scheduling-service:latest (74d23c548ae8)
#   - clinic_appointment_booking_queue_management_system-appointment-service:latest (66316c4ec49e)
#   - clinic_appointment_booking_queue_management_system-queue-service:latest (fe1e3dab3626)
#   - clinic_appointment_booking_queue_management_system-medical-records-service:latest (1b33e6be3c43)
#   - clinic_appointment_booking_queue_management_system-notification-service:latest (7f16f1d94204)
#   - clinic_appointment_booking_queue_management_system-frontend:latest (2b0ceb99b6eb)
# ==============================================================================
services:
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: clinic_sql_server
        environment:
            - ACCEPT_EULA=Y
            - SA_PASSWORD=${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
            - MSSQL_PID=Express
        ports:
            - "1433:1433"
        volumes:
            - mssql_data:/var/opt/mssql
        healthcheck:
            test:
                - CMD-SHELL
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        restart: always

    rabbitmq:
        image: rabbitmq:3.13-management
        hostname: clinic-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
        environment:
            RABBITMQ_DEFAULT_USER: clinic
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
        command:
            - /bin/bash
            - -c
            - rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: always

    mssql-exporter:
        image: awaragi/prometheus-mssql-exporter:latest
        environment:
            SERVER: db
            PORT: 1433
            USERNAME: sa
            PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
            ENCRYPT: "false"
            TRUST_SERVER_CERTIFICATE: "true"
        depends_on:
            db:
                condition: service_healthy
        expose:
            - "4000"
        restart: always

    backend:
        image: clinic_appointment_booking_queue_management_system-backend:latest
        container_name: clinic_backend
        ports:
            - "5000:8080"
        environment:
            - CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Ho_Chi_Minh}
            - Identity__Authority=http://identity-service:8080
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Scheduling__Authority=http://scheduling-service:8080
            - Services__Scheduling__BaseUrl=http://scheduling-service:8080
            - Appointment__Authority=http://appointment-service:8080
            - Queue__Authority=http://queue-service:8080
            - Services__Queue__BaseUrl=http://queue-service:8080
            - MedicalRecords__Authority=http://medical-records-service:8080
            - Services__MedicalRecords__BaseUrl=http://medical-records-service:8080
            - Notification__Authority=http://notification-service:8080
            - Services__Notification__BaseUrl=http://notification-service:8080
            - Identity__RequireHttpsMetadata=false
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__PublicBaseUrl=${IDENTITY_PUBLIC_BASE_URL:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - Jwt__RefreshTokenDays=${IDENTITY_REFRESH_TOKEN_DAYS:-7}
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
        depends_on:
            identity-service:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
            appointment-service:
                condition: service_healthy
            queue-service:
                condition: service_healthy
            medical-records-service:
                condition: service_healthy
            notification-service:
                condition: service_healthy
            jaeger:
                condition: service_started
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    identity-service:
        image: clinic_appointment_booking_queue_management_system-identity-service:latest
        ports:
            - "5001:8080"
        environment:
            - ConnectionStrings__IdentityConnection=Server=db,1433;Database=ClinicIdentityDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - Jwt__RefreshTokenDays=${IDENTITY_REFRESH_TOKEN_DAYS:-7}
            - Jwt__AccessTokenMinutes=${IDENTITY_ACCESS_TOKEN_MINUTES:-15}
            - Jwt__SigningKeyDirectory=/var/lib/clinic/identity-keys
            - Jwt__PublicBaseUrl=http://identity-service:8080
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - ASPNETCORE_HTTP_PORTS=8080
        volumes:
            - identity_signing_keys:/var/lib/clinic/identity-keys
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    scheduling-service:
        image: clinic_appointment_booking_queue_management_system-scheduling-service:latest
        container_name: clinic_scheduling_service
        ports:
            - "5002:8080"
        environment:
            - ConnectionStrings__SchedulingConnection=Server=db,1433;Database=ClinicSchedulingDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Services__InternalToken=${IDENTITY_SERVICE_TOKEN}
            - MedicalRecords__Authority=http://medical-records-service:8080
            - Services__MedicalRecords__BaseUrl=http://medical-records-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
            medical-records-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    identity-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql &&
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /verify.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
        volumes:
            - ./backend/Clinic.Identity.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            queue-service:
                condition: service_healthy
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            mssql-exporter:
                condition: service_started
            notification-service:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        restart: "no"

    scheduling-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
        volumes:
            - ./backend/Clinic.StaffScheduling.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
            - ./backend/Clinic.StaffScheduling.Service/Persistence/verify-scheduling-import.sql:/verify.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
        restart: "no"

    appointment-service:
        image: clinic_appointment_booking_queue_management_system-appointment-service:latest
        container_name: clinic_appointment_service
        ports:
            - "5003:8080"
        environment:
            - ConnectionStrings__AppointmentConnection=Server=db,1433;Database=ClinicAppointmentDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Ho_Chi_Minh}
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Scheduling__Authority=http://scheduling-service:8080
            - Services__Scheduling__BaseUrl=http://scheduling-service:8080
            - Appointment__Authority=http://appointment-service:8080
            - Queue__Authority=http://queue-service:8080
            - Services__Queue__BaseUrl=http://queue-service:8080
            - MedicalRecords__Authority=http://medical-records-service:8080
            - Services__MedicalRecords__BaseUrl=http://medical-records-service:8080
            - Notification__Authority=http://notification-service:8080
            - Services__Notification__BaseUrl=http://notification-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
            scheduling-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    appointment-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
        volumes:
            - ./backend/Clinic.Appointment.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            appointment-service:
                condition: service_healthy
        restart: "no"

    queue-service:
        image: clinic_appointment_booking_queue_management_system-queue-service:latest
        container_name: clinic_queue_service
        ports:
            - "5004:8080"
        environment:
            - ConnectionStrings__QueueConnection=Server=db,1433;Database=ClinicQueueDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Ho_Chi_Minh}
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Appointment__Authority=http://appointment-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    queue-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -v ClinicWindowsTimeZone="$$CLINIC_SQL_TIME_ZONE" -i /migration.sql &&
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /verify.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
            CLINIC_SQL_TIME_ZONE: ${CLINIC_SQL_TIME_ZONE:-SE Asia Standard Time}
        volumes:
            - ./backend/Clinic.Queue.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
            - ./backend/Clinic.Queue.Service/Persistence/verify-queue-import.sql:/verify.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            queue-service:
                condition: service_healthy
        restart: "no"

    medical-records-service:
        image: clinic_appointment_booking_queue_management_system-medical-records-service:latest
        container_name: clinic_medical_records_service
        ports:
            - "5005:8080"
        environment:
            - ConnectionStrings__MedicalRecordsConnection=Server=db,1433;Database=ClinicMedicalRecordsDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - CLINIC_TIME_ZONE=${CLINIC_TIME_ZONE:-Asia/Ho_Chi_Minh}
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Appointment__Authority=http://appointment-service:8080
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - ASPNETCORE_HTTP_PORTS=8080
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: always

    medical-records-data-importer:
        profiles: ["legacy-import"]
        image: mcr.microsoft.com/mssql/server:2022-latest
        entrypoint: ["/bin/bash", "-c"]
        command:
            - >-
                until /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; do sleep 3; done;
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /migration.sql &&
                /opt/mssql-tools18/bin/sqlcmd -C -S db,1433 -U sa -P "$$DB_SA_PASSWORD" -b -i /verify.sql
        environment:
            DB_SA_PASSWORD: ${DB_SA_PASSWORD:?Set DB_SA_PASSWORD in .env}
        volumes:
            - ./backend/Clinic.MedicalRecords.Service/Persistence/import-from-clinicdb.sql:/migration.sql:ro
            - ./backend/Clinic.MedicalRecords.Service/Persistence/verify-medical-records-import.sql:/verify.sql:ro
        depends_on:
            backend:
                condition: service_healthy
            medical-records-service:
                condition: service_healthy
        restart: "no"

    notification-service:
        image: clinic_appointment_booking_queue_management_system-notification-service:latest
        container_name: clinic_notification_service
        ports:
            - "5006:8080"
        environment:
            - ConnectionStrings__NotificationConnection=Server=db,1433;Database=ClinicNotificationDB;User Id=sa;Password=${DB_SA_PASSWORD:-ClinicDev!2026StrongPw};TrustServerCertificate=True;Encrypt=False
            - Identity__Authority=http://identity-service:8080
            - Identity__RequireHttpsMetadata=false
            - Identity__ServiceToken=${IDENTITY_SERVICE_TOKEN}
            - Email__Host=${SMTP_HOST:-smtp.gmail.com}
            - Email__Port=${SMTP_PORT:-587}
            - Email__Username=${SMTP_USERNAME}
            - Email__Password=${SMTP_PASSWORD}
            - Email__FromAddress=${SMTP_FROM_ADDRESS:-}
            - Email__FromName=${SMTP_FROM_NAME:-Clinic Notification}
            - DataProtection__KeyDirectory=/var/lib/clinic/notification-protection-keys
            - Jwt__Issuer=${IDENTITY_ISSUER:-http://localhost:5000}
            - Jwt__Audience=Clinic.Services
            - RabbitMq__Host=rabbitmq
            - RabbitMq__Port=5672
            - RabbitMq__Username=clinic
            - RabbitMq__Password=${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
            - RabbitMq__VirtualHost=/
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
            - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
            - ASPNETCORE_HTTP_PORTS=8080
        volumes:
            - notification_protection_keys:/var/lib/clinic/notification-protection-keys
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            identity-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/bin/bash",
                    "-c",
                    "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; IFS= read -r status <&3; [[ $$status == *'200'* ]]",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        restart: always

    frontend:
        image: clinic_appointment_booking_queue_management_system-frontend:latest
        container_name: clinic_frontend
        ports:
            - "3000:80" # Truy c├í┬║┬¡p Frontend ├í┬╗┼╕ giao di├í┬╗ΓÇín m├â┬íy th├í┬║┬¡t qua port 3000
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: always

    prometheus:
        image: prom/prometheus:v2.55.1
        container_name: clinic_prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ./observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
            - prometheus_data:/prometheus
        depends_on:
            backend:
                condition: service_healthy
            queue-service:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "--spider",
                    "http://127.0.0.1:9090/-/healthy",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always

    jaeger:
        image: jaegertracing/all-in-one:1.62.0
        container_name: clinic_jaeger
        environment:
            COLLECTOR_OTLP_ENABLED: "true"
        ports:
            - "16686:16686"
            - "4317:4317"
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:14269/"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always

volumes:
    mssql_data:
    rabbitmq_data:
    prometheus_data:
    identity_signing_keys:
    notification_protection_keys:
